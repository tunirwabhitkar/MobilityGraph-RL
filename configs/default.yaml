data:
  num_zones: 25
  num_days: 30
  train_ratio: 0.7
  val_ratio: 0.15

training:
  seq_len: 12
  pred_len: 1
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  dropout_rate: 0.2
  hidden_dim: 32

rl:
  max_relocations_per_step: 50
  cost_per_km: 0.5
  unmet_penalty: 10.0
  total_timesteps: 500000

api:
  host: "0.0.0.0"
  port: 8000
