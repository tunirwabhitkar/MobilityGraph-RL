version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - ENV=development

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
